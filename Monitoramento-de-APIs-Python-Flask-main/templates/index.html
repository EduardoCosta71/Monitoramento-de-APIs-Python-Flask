<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/monitorar.css') }}">

    <title>Monitoramento de APIs</title>
</head>

<body>

    <div class="container">

        <h1>Monitoramento de APIs</h1>

        <p>
            Insira o link da API que deseja monitorar.
        </p>

        <form action="{{ url_for('monitorar_api') }}" method="POST">

            <label for="url">URL da API</label>

            <input
                type="url"
                id="url"
                name="url"
                placeholder="https://api.exemplo.com"
                required
            >

            <button type="submit">
                Monitorar API
            </button>

        </form>

        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

    </div>

</body>

</html>
